name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-release-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
        run: |
          if [ -z "$RELEASE_STORE_FILE_BASE64" ]; then
            echo '::error::RELEASE_STORE_FILE_BASE64 secret is not set'
            exit 1
          fi
          echo "$RELEASE_STORE_FILE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Write local.properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "RELEASE_STORE_FILE=release.keystore"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } > local.properties

      - name: Run unit tests
        run: bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build signed release APK
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt

      - name: Verify APK alignment
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -v 4 "$APK" | tail -5

      - name: Compute SHA-256
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          sha256sum "$APK" | sed 's#app/build/outputs/apk/release/##' > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Build BUILD_INFO.txt
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          {
            echo "Name: call-recorder"
            echo "Version: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo "Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "APK size: $(stat -c%s "$APK") bytes"
            echo "SHA-256: $(cut -d' ' -f1 app-release.apk.sha256)"
            echo
            echo "Signature:"
            cat signature.txt
          } > BUILD_INFO.txt
          cat BUILD_INFO.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: call-recorder-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            BUILD_INFO.txt
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Call Recorder ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            BUILD_INFO.txt
          body: |
            ## Call Recorder ${{ github.ref_name }}

            Signed Android release APK (minSdk 29, targetSdk 36).

            ### Install
            ```bash
            adb install app-release.apk
            ```

            ### Verify
            Checksum is published in `app-release.apk.sha256` and `BUILD_INFO.txt`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
